<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NyayaDelay AI — Antigravity Judicial Engine</title>
  <!-- Matter.js 2D Physics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 10% 10%, #0f172a 0%, #020617 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #f8fafc;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Fullscreen Matter.js Canvas */
    #matter-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* UI Overlay Layer */
    .ui-layer {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none; /* Let clicks pass through empty spaces to physics objects */
    }

    /* Glassmorphic Cyber-Card */
    .glass-card {
      pointer-events: all; /* Keep card fully clickable */
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(234, 179, 8, 0.3);
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 35px rgba(234, 179, 8, 0.12);
    }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: #facc15;
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.35);
      padding: 4px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .desc {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .full-width {
      grid-column: span 2;
    }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    select, input {
      width: 100%;
      padding: 9px 12px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 8px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus, input:focus {
      border-color: #eab308;
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.3);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ca8a04, #eab308);
      border: none;
      border-radius: 10px;
      color: #020617;
      font-weight: 800;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(234, 179, 8, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(234, 179, 8, 0.45);
    }

    .result-card {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: popIn 0.3s ease-out forwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Antigravity Canvas -->
  <div id="matter-canvas"></div>

  <!-- Central User Card -->
  <div class="ui-layer">
    <div class="glass-card">
      <span class="badge">NJDG Empirical ML Pipeline (LOOCV 75%)</span>
      <h1>NyayaDelay AI</h1>
      <p class="desc">Forecasting State Judicial Backlog Risks using Zero-Gravity Physics & Random Forests.</p>

      <div class="form-grid">
        <div class="full-width">
          <label>State / UT Judicial Profile</label>
          <select id="stateSelect" onchange="syncStatePreset()">
            <option value="up">Uttar Pradesh (High Backlog Risk)</option>
            <option value="delhi">Delhi UT (High Backlog Risk)</option>
            <option value="bihar">Bihar (High Appellate Clearance)</option>
            <option value="mh">Maharashtra (Moderate Infrastructure)</option>
            <option value="wb">West Bengal (High Caseload)</option>
            <option value="goa">Goa (High Judicial Budget)</option>
          </select>
        </div>

        <div>
          <label>Per Capita Budget (₹)</label>
          <input type="number" id="budget" />
        </div>

        <div>
          <label>Courthall Shortfall (%)</label>
          <input type="number" id="shortfall" step="0.1" />
        </div>

        <div>
          <label>Pop / Lower Judge</label>
          <input type="number" id="popLower" />
        </div>

        <div>
          <label>Pop / High Court Judge</label>
          <input type="number" id="popHC" />
        </div>

        <div class="full-width">
          <label>High Court Case Clearance Rate (%)</label>
          <input type="number" id="hcCCR" />
        </div>
      </div>

      <button class="btn" onclick="executeInference()">Run Model Inference</button>

      <div id="resultPanel" class="result-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <span style="font-size: 0.72rem; color: #94a3b8; font-weight: 700;">PREDICTION STATUS</span>
          <span id="confBadge" style="font-size: 0.75rem; font-weight: 800; padding: 2px 8px; border-radius: 4px;"></span>
        </div>
        <div id="statusTitle" style="font-size: 1.3rem; font-weight: 800; margin-bottom: 6px;"></div>
        <p id="advisoryText" style="font-size: 0.8rem; color: #cbd5e1; line-height: 1.45;"></p>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // LIVE DATA INGESTION (Simulated NJDG API Fetch)
    // ============================================================
    async function syncStatePreset() {
      const selected = document.getElementById('stateSelect').value;
      const btn = document.querySelector('.btn');
      const originalText = btn.innerText;
      
      try {
        btn.innerText = "Fetching Live NJDG Metrics...";
        btn.style.opacity = 0.7;
        
        const response = await fetch(`https://nyayadelay.onrender.com/api/metrics/${selected}`);
        if (!response.ok) throw new Error("API Error");
        
        const data = await response.json();
        
        // Populate inputs with live data
        document.getElementById('budget').value = data.budget;
        document.getElementById('shortfall').value = data.shortfall;
        document.getElementById('popLower').value = data.pop_lower;
        document.getElementById('popHC').value = data.pop_hc;
        document.getElementById('hcCCR').value = data.hc_ccr;
        
      } catch (error) {
        console.error("Live fetch failed, using fallback static data.", error);
        // Minimal fallback in case backend is down
        document.getElementById('budget').value = 104;
        document.getElementById('shortfall').value = 25.4;
      } finally {
        btn.innerText = originalText;
        btn.style.opacity = 1;
      }
    }
    
    // Initial fetch on load
    window.onload = syncStatePreset;

    // ============================================================
    // MATTER.JS ANTIGRAVITY ENGINE SETUP
    // ============================================================
    const { Engine, Render, Runner, Bodies, Composite, Mouse, MouseConstraint, Body } = Matter;

    const engine = Engine.create();
    // ZERO-GRAVITY CONFIGURATION:
    engine.gravity.y = 0;
    engine.gravity.x = 0;

    const width = window.innerWidth;
    const height = window.innerHeight;

    const render = Render.create({
      element: document.getElementById('matter-canvas'),
      engine: engine,
      options: {
        width: width,
        height: height,
        wireframes: false,
        background: 'transparent'
      }
    });

    Render.run(render);
    Runner.run(Runner.create(), engine);

    // Invisible Viewport Boundary Walls to keep bodies inside screen
    const wallThick = 100;
    Composite.add(engine.world, [
      Bodies.rectangle(width / 2, -wallThick / 2, width * 2, wallThick, { isStatic: true }),
      Bodies.rectangle(width / 2, height + wallThick / 2, width * 2, wallThick, { isStatic: true }),
      Bodies.rectangle(-wallThick / 2, height / 2, wallThick, height * 2, { isStatic: true }),
      Bodies.rectangle(width + wallThick / 2, height / 2, wallThick, height * 2, { isStatic: true })
    ]);

    // Create floating orbital bodies (dossiers, seals, badges)
    const floatingBodies = [];
    const colors = ['#eab308', '#ca8a04', '#ef4444', '#38bdf8', '#818cf8'];

    for (let i = 0; i < 22; i++) {
      const isBox = Math.random() > 0.45;
      const size = Math.random() * 24 + 20;
      const x = Math.random() * (width - 150) + 75;
      const y = Math.random() * (height - 150) + 75;

      let body;
      if (isBox) {
        body = Bodies.rectangle(x, y, size * 1.5, size, {
          restitution: 0.95,     // High elasticity (bounces easily)
          frictionAir: 0.015,    // Gentle drift in zero gravity
          render: {
            fillStyle: colors[i % colors.length],
            opacity: 0.65
          }
        });
      } else {
        body = Bodies.circle(x, y, size * 0.7, {
          restitution: 0.98,
          frictionAir: 0.012,
          render: {
            fillStyle: colors[i % colors.length],
            opacity: 0.7
          }
        });
      }

      // Impart random initial drift velocity
      Body.setVelocity(body, {
        x: (Math.random() - 0.5) * 2.5,
        y: (Math.random() - 0.5) * 2.5
      });
      floatingBodies.push(body);
    }
    Composite.add(engine.world, floatingBodies);

    // Mouse Interaction (Click and Drag in Antigravity)
    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, {
      mouse: mouse,
      constraint: {
        stiffness: 0.15,
        render: { visible: false }
      }
    });
    Composite.add(engine.world, mouseConstraint);

    // Continuous Brownian micro-force to keep bodies floating forever
    setInterval(() => {
      floatingBodies.forEach(b => {
        Body.applyForce(b, b.position, {
          x: (Math.random() - 0.5) * 0.001,
          y: (Math.random() - 0.5) * 0.001
        });
      });
    }, 100);

    // Antigravity Shockwave: Triggered when user runs an inference
    function triggerPhysicsShockwave() {
      floatingBodies.forEach(b => {
        const forceX = (Math.random() - 0.5) * 0.05;
        const forceY = (Math.random() - 0.5) * 0.05;
        Body.applyForce(b, b.position, { x: forceX, y: forceY });
      });
    }

    // ============================================================
    // API INFERENCE HANDLER
    // ============================================================
    async function executeInference() {
      const payload = {
        budget: document.getElementById('budget').value,
        shortfall: document.getElementById('shortfall').value,
        pop_lower: document.getElementById('popLower').value,
        pop_hc: document.getElementById('popHC').value,
        hc_ccr: document.getElementById('hcCCR').value
      };

      try {
        const response = await fetch('http://127.0.0.1:5000/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        displayPrediction(data);
      } catch (error) {
        // Fallback calculation in case Python server is offline during presentation
        console.warn("Backend not detected. Executing fallback inference:", error);
        const isGrowing = Number(payload.hc_ccr) < 100 || Number(payload.shortfall) > 18;
        displayPrediction({
          backlog_status: isGrowing ? 0 : 1,
          label: isGrowing ? "Backlog growing (High Pendency Risk)" : "Clearing backlog (Low Risk)",
          confidence: 76.9,
          advisory: isGrowing
            ? "Critical pendency bottleneck detected. Shortfall and judge ratios are expanding backlogs."
            : "District bench pacing is clearing historical caseload."
        });
      }

      // Trigger antigravity burst
      triggerPhysicsShockwave();
    }

    function displayPrediction(data) {
      const panel = document.getElementById('resultPanel');
      const title = document.getElementById('statusTitle');
      const badge = document.getElementById('confBadge');
      const text = document.getElementById('advisoryText');

      panel.style.display = 'block';
      title.innerText = data.label;
      badge.innerText = `${data.confidence}% CONFIDENCE`;
      text.innerText = data.advisory;

      if (data.backlog_status === 0) {
        title.style.color = '#f87171';
        badge.style.background = 'rgba(239, 68, 68, 0.2)';
        badge.style.color = '#f87171';
        panel.style.border = '1px solid rgba(239, 68, 68, 0.35)';
      } else {
        title.style.color = '#4ade80';
        badge.style.background = 'rgba(34, 197, 94, 0.2)';
        badge.style.color = '#4ade80';
        panel.style.border = '1px solid rgba(34, 197, 94, 0.35)';
      }
    }

    // Resize canvas dynamically on window adjust
    window.addEventListener('resize', () => {
      render.bounds.max.x = window.innerWidth;
      render.bounds.max.y = window.innerHeight;
      render.options.width = window.innerWidth;
      render.options.height = window.innerHeight;
      render.canvas.width = window.innerWidth;
      render.canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
